<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Góc truyện của Trọng</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #f2f7fc;
      color: #1c3552;
      font: 15px Arial, sans-serif;
    }
    main { max-width: 1000px; margin: auto; }
    h1, h2 { margin-top: 0; }
    h1 { color: #1e5e9e; }
    .box {
      background: white;
      border: 1px solid #dce7f1;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    input, select, textarea, button {
      font: inherit;
      border-radius: 8px;
    }
    input, select, textarea {
      border: 1px solid #cddbea;
      padding: 10px;
      color: #1c3552;
      background: white;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #a8d0f2;
      border-color: #398bd3;
    }
    button {
      border: 0;
      background: #2878c7;
      color: white;
      padding: 10px 13px;
      cursor: pointer;
    }
    button:hover { background: #1e5e9e; }
    .add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }
    .add-form input { flex: 1; min-width: 180px; }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      align-items: start;
    }
    .story-list { display: grid; gap: 8px; }
    .story-item {
      width: 100%;
      text-align: left;
      background: #edf5fc;
      color: #1c3552;
      border: 1px solid #dce7f1;
    }
    .story-item:hover, .story-item.selected {
      background: #dceeff;
      border-color: #8abce8;
    }
    .story-item small { display: block; margin-top: 5px; color: #60758b; }
    .muted { color: #718096; }
    .chapters { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0; }
    .chapter-button {
      background: #eaf3fc;
      color: #1e5e9e;
      border: 1px solid #cddff0;
    }
    .chapter-button.selected { background: #2878c7; color: white; }
    textarea { width: 100%; min-height: 260px; resize: vertical; line-height: 1.6; }
    .chapter-name { width: 100%; margin: 10px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .delete { background: #d65b65; }
    .delete:hover { background: #b9444e; }
    @media (max-width: 700px) {
      body { padding: 14px; }
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <h1>📘 Kho truyện của Trọng</h1>
  <p class="muted">Lưu truyện, chia theo thể loại và viết từng chương.</p>

  <section class="box">
    <h2>Thêm truyện</h2>
    <form class="add-form" id="story-form">
      <input id="story-title" placeholder="Tên truyện..." required>
      <select id="story-genre">
        <option>Giả tưởng</option>
        <option>Tình cảm</option>
        <option>Trinh thám</option>
        <option>Phiêu lưu</option>
        <option>Đời thường</option>
        <option>Kinh dị</option>
        <option>Khoa học viễn tưởng</option>
        <option>Thơ</option>
        <option>Khác</option>
      </select>
      <button type="submit">＋ Tạo truyện</button>
    </form>
  </section>

  <div class="layout">
    <section class="box">
      <h2>Kệ truyện</h2>
      <select id="filter" style="width:100%; margin-bottom:10px">
        <option value="">Tất cả thể loại</option>
        <option>Giả tưởng</option>
        <option>Tình cảm</option>
        <option>Trinh thám</option>
        <option>Phiêu lưu</option>
        <option>Đời thường</option>
        <option>Kinh dị</option>
        <option>Khoa học viễn tưởng</option>
        <option>Thơ</option>
        <option>Khác</option>
      </select>
      <div class="story-list" id="story-list"></div>
    </section>

    <section class="box" id="details">
      <p class="muted">Chọn một truyện hoặc tạo truyện mới để bắt đầu.</p>
    </section>
  </div>
</main>

<script>
  const KEY = "kho-truyen-cua-trong";
  let stories = JSON.parse(localStorage.getItem(KEY) || "[]");
  let selectedStory = null;
  let selectedChapter = null;

  const $ = id => document.getElementById(id);
  const safe = text => String(text || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);

  function save() {
    localStorage.setItem(KEY, JSON.stringify(stories));
  }

  function render() {
    const filter = $("filter").value;
    const list = $("story-list");
    const shown = stories.filter(story => !filter || story.genre === filter);

    list.innerHTML = shown.length
      ? shown.map(story => `
          <button class="story-item ${story.id === selectedStory ? "selected" : ""}"
                  data-story="${safe(story.id)}">
            ${safe(story.title)}
            <small>${safe(story.genre)} · ${story.chapters.length} chương</small>
          </button>
        `).join("")
      : '<p class="muted">Chưa có truyện trong mục này.</p>';

    list.querySelectorAll("[data-story]").forEach(button => {
      button.onclick = () => {
        selectedStory = button.dataset.story;
        selectedChapter = null;
        render();
      };
    });

    const story = stories.find(item => item.id === selectedStory);
    if (!story) {
      $("details").innerHTML = '<p class="muted">Chọn một truyện hoặc tạo truyện mới để bắt đầu.</p>';
      return;
    }

    const chapter = story.chapters.find(item => item.id === selectedChapter);

    $("details").innerHTML = `
      <h2>${safe(story.title)}</h2>
      <p class="muted">${safe(story.genre)} · ${story.chapters.length} chương</p>
      <div class="chapters">
        ${story.chapters.map((item, index) => `
          <button class="chapter-button ${item.id === selectedChapter ? "selected" : ""}"
                  data-chapter="${safe(item.id)}">Chương ${index + 1}</button>
        `).join("")}
        <button id="add-chapter">＋ Thêm chương</button>
      </div>
      ${chapter ? `
        <input class="chapter-name" id="chapter-name" value="${safe(chapter.title)}"
               placeholder="Tên chương">
        <textarea id="chapter-text" placeholder="Viết nội dung chương...">${safe(chapter.text)}</textarea>
        <div class="actions">
          <button id="save-chapter">Lưu chương</button>
          <button class="delete" id="delete-chapter">Xóa chương</button>
          <button class="delete" id="delete-story">Xóa truyện</button>
        </div>
      ` : `
        <p class="muted">Chọn một chương để viết tiếp, hoặc bấm “Thêm chương”.</p>
        <button class="delete" id="delete-story">Xóa truyện</button>
      `}
    `;

    $("details").querySelectorAll("[data-chapter]").forEach(button => {
      button.onclick = () => {
        selectedChapter = button.dataset.chapter;
        render();
      };
    });

    $("add-chapter").onclick = () => {
      const title = prompt("Đặt tên chương:");
      if (!title || !title.trim()) return;
      const newChapter = {
        id: Date.now().toString(),
        title: title.trim(),
        text: ""
      };
      story.chapters.push(newChapter);
      selectedChapter = newChapter.id;
      save();
      render();
    };

    $("delete-story").onclick = () => {
      if (!confirm("Xóa truyện này và tất cả chương?")) return;
      stories = stories.filter(item => item.id !== selectedStory);
      selectedStory = null;
      selectedChapter = null;
      save();
      render();
    };

    if (chapter) {
      $("save-chapter").onclick = () => {
        chapter.title = $("chapter-name").value.trim() || "Chương chưa đặt tên";
        chapter.text = $("chapter-text").value;
        save();
        render();
      };

      $("delete-chapter").onclick = () => {
        if (!confirm("Xóa chương này?")) return;
        story.chapters = story.chapters.filter(item => item.id !== selectedChapter);
        selectedChapter = null;
        save();
        render();
      };
    }
  }

  $("story-form").addEventListener("submit", event => {
    event.preventDefault();
    const title = $("story-title").value.trim();
    if (!title) return;

    const story = {
      id: Date.now().toString(),
      title,
      genre: $("story-genre").value,
      chapters: []
    };

    stories.unshift(story);
    selectedStory = story.id;
    selectedChapter = null;
    $("story-title").value = "";
    save();
    render();
  });

  $("filter").addEventListener("change", render);
  render();
</script>
</body>
</html>
